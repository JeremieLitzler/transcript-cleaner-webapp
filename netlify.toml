# The Git integration stays for deploy previews (Q16); production is deployed by
# the release workflow's build hook, so a push to `develop` never ships unreleased.
#
# Connecting the repository in Netlify's UI is a one-time manual step and is not
# expressed here; this file is only the build contract once it is connected.

[build]
  # Exit 0 means skip (the inverse of shell habit): see https://docs.netlify.com/build/configure-builds/ignore-builds and https://docs.netlify.com/build/configure-builds/environment-variables
  ignore = "test \"$CONTEXT\" = production && test -z \"$INCOMING_HOOK_TITLE\""
  # The root script, not `vite build` directly: it runs `--workspaces`, so
  # `packages/rules` is typechecked on the way past rather than skipped.
  command = "npm run build"
  publish = "packages/web/dist"

[build.environment]
  # Pinned rather than left to Netlify's default image, which moves. Matches
  # the `lts/*` the PR workflow resolves to.
  NODE_VERSION = "24"

# Inert today — the app is a single page with no router. Kept so that adding
# one is a routing change and not also a deploy incident.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
