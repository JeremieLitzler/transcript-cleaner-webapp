name: Release (release.sh)
run-name: ${{ github.actor }} runs release.sh (${{ github.event.pull_request.merged && 'publish' || 'preview' }}) on #${{ github.event.pull_request.number }}

# The sole release pipeline (issue #13). Runs the vendored
# `scripts/release/release.sh`, which reads the conventional commits in the
# range, decides the next version, writes the notes, tags and publishes.
#
# Ported from `french-gas-stations-scraper`. Two deliberate divergences from it,
# both noted at the point they appear below: the source branch is actually
# filtered on rather than merely declared, and the action pins are current.
#
# `release.sh`'s `gate()` prompts abort in any non-TTY environment, so every CI
# run — preview or publish — has to pass `--yes`. `--dry-run` only skips the
# destructive remote steps (tag push, release publish); it does not skip the
# gates, which is why both modes carry `--yes`.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# The branch pair as configuration. `on:` triggers cannot read expressions, so
# the filtering happens in determine-mode below.
env:
  RELEASE_SOURCE_BRANCH: develop
  RELEASE_TARGET_BRANCH: main

permissions:
  contents: read

jobs:
  determine-mode:
    name: Determine release mode
    runs-on: ubuntu-latest
    outputs:
      is_preview: ${{ steps.decide.outputs.is_preview }}
      is_publish: ${{ steps.decide.outputs.is_publish }}
      target_branch: ${{ steps.decide.outputs.target_branch }}
    steps:
      - name: Decide preview vs publish vs skip
        id: decide
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_ACTION: ${{ github.event.action }}
          PULL_REQUEST_MERGED: ${{ github.event.pull_request.merged }}
          RELEASE_SOURCE_BRANCH: ${{ env.RELEASE_SOURCE_BRANCH }}
          RELEASE_TARGET_BRANCH: ${{ env.RELEASE_TARGET_BRANCH }}
        run: |
          emit_outputs() {
            echo "is_preview=$is_preview" >>"$GITHUB_OUTPUT"
            echo "is_publish=$is_publish" >>"$GITHUB_OUTPUT"
            echo "target_branch=$RELEASE_TARGET_BRANCH" >>"$GITHUB_OUTPUT"
          }

          is_preview=false
          is_publish=false

          # Divergence from the reference: it declares RELEASE_SOURCE_BRANCH and
          # then never reads it, so *any* pull request into the target branch
          # cuts a release. Here the pair is matched on both ends, so a release
          # is what `develop` merging into `main` means and nothing else.
          if [[ "$BASE_REF" != "$RELEASE_TARGET_BRANCH" || "$HEAD_REF" != "$RELEASE_SOURCE_BRANCH" ]]; then
            emit_outputs
            exit 0
          fi

          if [[ "$EVENT_ACTION" != "closed" ]]; then
            is_preview=true
            emit_outputs
            exit 0
          fi

          [[ "$PULL_REQUEST_MERGED" == "true" ]] && is_publish=true
          emit_outputs

  preview:
    name: Preview release
    needs: determine-mode
    if: needs.determine-mode.outputs.is_preview == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    concurrency:
      group: release-bash-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # release.sh reads the whole commit range back to the last v* tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Run release.sh --dry-run
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          bash scripts/release/release.sh --yes --dry-run 2>&1 | tee release-output.log
          script_exit_code=${PIPESTATUS[0]}
          set -e
          if [[ $script_exit_code -ne 0 ]] && grep -q "no commit to release in range" release-output.log; then
            echo "No releasable commits since the last tag; nothing to preview."
            exit 0
          fi
          exit "$script_exit_code"

  publish:
    name: Publish release
    needs: determine-mode
    if: needs.determine-mode.outputs.is_publish == 'true'
    runs-on: ubuntu-latest
    # A named environment so the release step has somewhere to hang required
    # reviewers or a wait timer later, without editing this file.
    environment:
      name: CI
    permissions:
      contents: read
    concurrency:
      group: release-bash-publish-${{ needs.determine-mode.outputs.target_branch }}
      cancel-in-progress: false
    steps:
      # `main` is protected, so the default GITHUB_TOKEN cannot push a tag to
      # it. Needs a GitHub App installed on this repo — see the setup checklist
      # in scripts/release/VENDORED.md.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_KEY }}

      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.determine-mode.outputs.target_branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Configure git identity for the GitHub App
        env:
          APP_ID: ${{ secrets.GH_APP_ID }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Run release.sh
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set +e
          bash scripts/release/release.sh --yes 2>&1 | tee release-output.log
          script_exit_code=${PIPESTATUS[0]}
          set -e
          if [[ $script_exit_code -ne 0 ]] && grep -q "no commit to release in range" release-output.log; then
            echo "No releasable commits since the last tag; nothing to publish."
            exit 0
          fi
          exit "$script_exit_code"
