name: release

# Production is deployed by `deploy-site` through a job of its own, so a Netlify outage never turns a published release red.
on:
  push:
    branches: [develop, 'release/**']
  workflow_dispatch:
    inputs:
      action:
        description: preview dry-runs the release; publish cuts it (develop or release/* only); deploy-site redeploys the website without a release
        type: choice
        options: [preview, publish, deploy-site]
        default: preview

# Pinned to a SHA (a tag can move) and fetched from the script repo, so a commit cannot break its own release.
# To move the pin, see `docs/agents/ci.md`.
env:
  # v1.0.0
  RELEASE_SCRIPT_REF: 3a803a8290aeae72e404cab7b2d655d0e2e81ea4

permissions:
  contents: read

jobs:
  preview:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'preview')
    runs-on: ubuntu-latest
    concurrency:
      group: release-preview
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch the pinned release.sh
        run: |
          curl -fsSL "https://raw.githubusercontent.com/JeremieLitzler/semantic-release-script/${RELEASE_SCRIPT_REF}/scripts/release/release.sh" \
            -o "$RUNNER_TEMP/release.sh"
          chmod +x "$RUNNER_TEMP/release.sh"

      - name: Dry-run the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          "$RUNNER_TEMP/release.sh" --dry-run --level-from "$GITHUB_REF_NAME" \
            --summary "$RUNNER_TEMP/release.env" --notes "$RUNNER_TEMP/notes.md"
          code=$?
          set -e
          {
            echo "## Release preview"
            echo
            if [[ $code -eq 0 ]]; then
              echo '```'
              cat "$RUNNER_TEMP/release.env"
              echo '```'
              echo
              cat "$RUNNER_TEMP/notes.md"
            elif [[ $code -eq 2 ]]; then
              echo "Nothing to release: no commit since the last version tag."
            else
              echo "The preview stopped with exit code $code. See the step log."
            fi
          } >>"$GITHUB_STEP_SUMMARY"
                [[ $code -eq 0 || $code -eq 2 ]]

  guard:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'publish')
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a ref that cannot publish
        run: |
          if [[ "$GITHUB_REF" != refs/heads/develop && "$GITHUB_REF" != refs/heads/release/* ]]; then
            echo "::error::publish runs from develop or a release/* branch, not $GITHUB_REF"
            exit 1
          fi

  check:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - run: npm ci

      - run: npm audit signatures

      # Not `npm run test`: `check` also typechecks `packages/rules`, which has no build step.
      - run: npm run check

  build:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - run: npm ci

      - run: npm audit signatures

      - run: npm run build

  publish:
    needs: [guard, check, build]
    runs-on: ubuntu-latest
    environment:
      name: CI
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
    # A queued publish is never replaced by a later one.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # The commit check and build validated, not whatever the ref moved to.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Refuse a release/* ref that develop does not contain
        if: startsWith(github.ref, 'refs/heads/release/')
        run: |
          git fetch --no-tags origin develop
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::$GITHUB_REF_NAME is not contained in develop; merge it or cut a new release branch from develop"
            exit 1
          fi

      - name: Delete an orphaned tag a failed run left on this commit
        run: |
          git fetch --tags --force origin
          for tag in $(git tag --points-at HEAD --list 'v*'); do
            if gh release view "$tag" >"$RUNNER_TEMP/rv.out" 2>&1; then
              continue
            fi
            # Only "not found" proves an orphan; deleting on any other failure could strand a real release.
            if ! grep -q "release not found" "$RUNNER_TEMP/rv.out"; then
              echo "::error::could not tell whether $tag has a release: $(cat "$RUNNER_TEMP/rv.out")"
              exit 1
            fi
            echo "Deleting orphaned tag $tag (no GitHub release carries it)"
            git push origin --delete "refs/tags/$tag"
            git tag -d "$tag"
          done

      - name: Fetch the pinned release.sh
        run: |
          curl -fsSL "https://raw.githubusercontent.com/JeremieLitzler/semantic-release-script/${RELEASE_SCRIPT_REF}/scripts/release/release.sh" \
            -o "$RUNNER_TEMP/release.sh"
          chmod +x "$RUNNER_TEMP/release.sh"

      # An annotated tag needs a committer, and a runner has none.
      - name: Set the git identity of the tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Cut the release
        id: release
        run: |
          set +e
          "$RUNNER_TEMP/release.sh" --yes --level-from "$GITHUB_REF_NAME" \
            --summary "$RUNNER_TEMP/release.env"
          code=$?
          set -e
          if [[ $code -eq 2 ]]; then
            echo "Nothing to release: no commit since the last version tag." >>"$GITHUB_STEP_SUMMARY"
            echo "released=no" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          [[ $code -eq 0 ]] || exit "$code"
          # Only the documented keys, one line each, reach the outputs.
          grep -E '^(tag|version|bump|baseline|released)=[A-Za-z0-9.+-]*$' "$RUNNER_TEMP/release.env" >>"$GITHUB_OUTPUT"

      - name: Report
        if: steps.release.outputs.released == 'yes'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: echo "Published $TAG" >>"$GITHUB_STEP_SUMMARY"

      - name: Delete the release branch
        if: >-
          github.event_name == 'push' &&
          startsWith(github.ref, 'refs/heads/release/') &&
          steps.release.outputs.released == 'yes'
        run: git push origin --delete "$GITHUB_REF_NAME"

  deploy-site:
    needs: publish
    # always(): a deploy-site dispatch skips the needs, which would skip this job too.
    if: >-
      always() && (
        (needs.publish.result == 'success' && needs.publish.outputs.released == 'yes') ||
        (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy-site' && github.ref == 'refs/heads/develop')
      )
    runs-on: ubuntu-latest
    # NETLIFY_BUILD_HOOK lives in the CI environment.
    environment: CI
    permissions: {}
    steps:
      - name: Call the Netlify build hook
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [[ -z "$NETLIFY_BUILD_HOOK" ]]; then
            echo "::error::the NETLIFY_BUILD_HOOK secret is not set"
            exit 1
          fi
          curl -fsS -X POST -d '{}' "$NETLIFY_BUILD_HOOK"
          echo "Netlify build triggered" >>"$GITHUB_STEP_SUMMARY"
